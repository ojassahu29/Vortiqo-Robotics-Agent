[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vortiqo"
version = "0.1.0"
description = "Agentic AI robotics system for natural-language task understanding, visual perception, autonomous planning, robot action generation, and goal verification."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]